# Self-run Baltan agent next to Redis (copy env from dashboard → Install agent).
#
#   export AGENT_TOKEN=rk_...      # rotate in app — shown once
#   export AGENT_ID=agt_...
#   export INGEST_URL=https://your-app.example.com/api
#   export REDIS_ADDR=host.docker.internal:6379
#   docker compose -f docker-compose.agent.yaml up -d
#
# Local dev ingest: INGEST_URL=http://host.docker.internal:3001

services:
  agent:
    image: ghcr.io/kartikeytandon/baltan:v0.0.5
    restart: unless-stopped
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:?set AGENT_TOKEN}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - --addr=${REDIS_ADDR:-host.docker.internal:6379}
      - --engine=${REDIS_ENGINE:-redis}
      - --agent-id=${AGENT_ID:?set AGENT_ID}
      - --ingest-url=${INGEST_URL:?set INGEST_URL}
      - --interval=${INTERVAL:-10s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
