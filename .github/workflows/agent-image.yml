name: agent-image

on:
  push:
    branches: [master, main]
    paths:
      - "apps/agent/**"
      - ".github/workflows/agent-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/agent
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/baltan:v0.0.1
            ghcr.io/${{ github.repository_owner }}/baltan:latest
            ghcr.io/${{ github.repository_owner }}/baltan:${{ github.sha }}
